<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NABTA Sprite Region Editor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #18372e;
        background: #f7f8f2;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 48px; }
      h1 { margin: 0; font-size: 1.65rem; }
      p { max-width: 760px; color: #536a60; line-height: 1.55; }
      .toolbar, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .toolbar { margin: 22px 0 14px; }
      button, .file-picker {
        min-height: 40px;
        border: 1px solid #cbd8cc;
        border-radius: 6px;
        padding: 8px 13px;
        color: #23483a;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.primary { color: #fff; background: #1f674a; border-color: #1f674a; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      input[type="file"] { max-width: 100%; }
      .canvas-wrap { overflow: auto; border: 1px solid #cbd8cc; background: #fff; padding: 12px; }
      canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
      .empty { color: #70837a; padding: 38px 16px; text-align: center; }
      .region-list { display: grid; gap: 8px; margin: 18px 0; }
      .region-row { display: grid; grid-template-columns: minmax(120px, 1fr) auto auto; align-items: center; gap: 10px; border-bottom: 1px solid #dde5da; padding: 8px 0; }
      .region-row input { min-width: 0; min-height: 36px; border: 1px solid #cbd8cc; border-radius: 5px; padding: 6px 9px; }
      .coordinates { color: #667b70; font: 0.85rem ui-monospace, monospace; }
      .status { min-height: 1.5em; color: #8b452a; }
      .actions { margin-top: 16px; }
      @media (max-width: 560px) {
        main { padding: 22px 14px 36px; }
        .region-row { grid-template-columns: minmax(100px, 1fr) auto; }
        .coordinates { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sprite Region Editor</h1>
      <p>Load a PNG, then drag a rectangle around each individual object. You can draw separate regions inside a connected group. Regions are exported for review only; they are not automatically approved artwork.</p>
      <div class="toolbar">
        <label class="file-picker">Open spritesheet <input id="file" type="file" accept="image/png" hidden></label>
        <button id="undo" type="button" disabled>Undo last region</button>
        <button id="clear" type="button" disabled>Clear regions</button>
      </div>
      <div class="canvas-wrap">
        <div id="empty" class="empty">Choose one of the source PNG sheets to begin.</div>
        <canvas id="sheet" aria-label="Spritesheet crop editor" hidden></canvas>
      </div>
      <div id="regions" class="region-list" aria-live="polite"></div>
      <div class="actions">
        <button id="export" class="primary" type="button" disabled>Download region JSON</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </main>
    <script>
      const fileInput = document.querySelector("#file");
      const canvas = document.querySelector("#sheet");
      const context = canvas.getContext("2d");
      const regionList = document.querySelector("#regions");
      const empty = document.querySelector("#empty");
      const status = document.querySelector("#status");
      const regions = [];
      const image = new Image();
      let filename = "";
      let activePointer = null;
      let startPoint = null;
      let currentPoint = null;

      function getPoint(event) {
        const bounds = canvas.getBoundingClientRect();
        const x = Math.floor((event.clientX - bounds.left) * image.naturalWidth / bounds.width);
        const y = Math.floor((event.clientY - bounds.top) * image.naturalHeight / bounds.height);
        return {
          x: Math.max(0, Math.min(image.naturalWidth - 1, x)),
          y: Math.max(0, Math.min(image.naturalHeight - 1, y)),
        };
      }

      function normalizedBox(first, last) {
        const x = Math.min(first.x, last.x);
        const y = Math.min(first.y, last.y);
        return {
          x,
          y,
          width: Math.abs(first.x - last.x) + 1,
          height: Math.abs(first.y - last.y) + 1,
        };
      }

      function render() {
        if (!image.complete || !image.naturalWidth) return;
        context.imageSmoothingEnabled = false;
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        regions.forEach((region, index) => drawBox(region, `R${String(index + 1).padStart(2, "0")}`, index));
        if (startPoint && currentPoint) drawBox(normalizedBox(startPoint, currentPoint), "", regions.length);
        renderRegionList();
      }

      function drawBox(box, label, index) {
        const colors = ["#e34635", "#1674bd", "#15846b", "#a84f9c", "#d28b13"];
        const color = colors[index % colors.length];
        const scale = canvas.width / image.naturalWidth;
        const x = box.x * scale;
        const y = box.y * scale;
        context.save();
        context.strokeStyle = color;
        context.lineWidth = Math.max(2, scale / 2);
        context.strokeRect(x, y, box.width * scale, box.height * scale);
        if (label) {
          context.font = `${Math.max(7, scale * 5)}px sans-serif`;
          const labelWidth = context.measureText(label).width + 4;
          context.fillStyle = color;
          const labelY = Math.max(0, y - scale * 7);
          context.fillRect(x, labelY, labelWidth, scale * 7);
          context.fillStyle = "#fff";
          context.fillText(label, x + 2, Math.max(scale * 6, labelY + scale * 6));
        }
        context.restore();
      }

      function renderRegionList() {
        regionList.replaceChildren();
        regions.forEach((region, index) => {
          const row = document.createElement("div");
          row.className = "region-row";
          const name = document.createElement("input");
          name.value = region.id;
          name.setAttribute("aria-label", `Name for region ${index + 1}`);
          name.addEventListener("input", () => {
            region.id = name.value.trim().replace(/[^a-zA-Z0-9_-]+/g, "_") || `region_${index + 1}`;
          });
          const coordinates = document.createElement("span");
          coordinates.className = "coordinates";
          coordinates.textContent = `x:${region.x} y:${region.y} w:${region.width} h:${region.height}`;
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Remove";
          remove.addEventListener("click", () => {
            regions.splice(index, 1);
            render();
          });
          row.append(name, coordinates, remove);
          regionList.append(row);
        });
        document.querySelector("#undo").disabled = regions.length === 0;
        document.querySelector("#clear").disabled = regions.length === 0;
        document.querySelector("#export").disabled = regions.length === 0 || !filename;
      }

      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        filename = file.name;
        regions.splice(0, regions.length);
        image.onload = () => {
          const scale = 3;
          canvas.width = image.naturalWidth * scale;
          canvas.height = image.naturalHeight * scale;
          canvas.hidden = false;
          empty.hidden = true;
          status.textContent = `${filename}: ${image.naturalWidth} x ${image.naturalHeight}`;
          render();
        };
        image.onerror = () => { status.textContent = "Could not open that PNG."; };
        image.src = URL.createObjectURL(file);
      });

      canvas.addEventListener("pointerdown", event => {
        if (!image.naturalWidth) return;
        activePointer = event.pointerId;
        startPoint = getPoint(event);
        currentPoint = startPoint;
        canvas.setPointerCapture(activePointer);
        render();
      });

      canvas.addEventListener("pointermove", event => {
        if (event.pointerId !== activePointer) return;
        currentPoint = getPoint(event);
        render();
      });

      canvas.addEventListener("pointerup", event => {
        if (event.pointerId !== activePointer) return;
        const box = normalizedBox(startPoint, getPoint(event));
        if (box.width > 1 || box.height > 1) {
          const index = regions.length + 1;
          regions.push({ id: `region_${String(index).padStart(3, "0")}`, ...box });
        }
        activePointer = null;
        startPoint = null;
        currentPoint = null;
        render();
      });

      document.querySelector("#undo").addEventListener("click", () => { regions.pop(); render(); });
      document.querySelector("#clear").addEventListener("click", () => { regions.splice(0, regions.length); render(); });
      document.querySelector("#export").addEventListener("click", () => {
        const payload = {
          schema_version: 1,
          sheets: { [filename]: regions.map(region => ({ ...region })) },
        };
        const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "manual-regions.json";
        link.click();
        URL.revokeObjectURL(link.href);
      });
    </script>
  </body>
</html>
